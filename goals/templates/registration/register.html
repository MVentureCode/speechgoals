{% extends 'goals/base.html' %}

{% block contenido %}

    <h2>Crear una cuenta</h2>

 <!-- Formulario de registro.
    Django se encarga de generar y validar
    los campos de usuario y contraseña. -->
    <form method="post">
        <!-- Token de seguridad obligatorio para formularios POST.
        Protege contra ataques CSRF. -->
        {% csrf_token %}

        <!-- UserCreationForm genera los campos necesarios
        y muestra los errores de validación. -->
        {{ form.as_p }}

        <button type="submit">
            Registrarse
        </button>
    </form>

    <p>
        ¿Ya tienes una cuenta?
        <a href="{% url 'login' %}">
            Iniciar sesión
        </a>
    </p>

{% endblock %}
